
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SOLENN — Multi-Angle Product Window Preview</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body class="bg-neutral-950 text-neutral-100 p-8 md:p-12 font-sans antialiased">
  <div class="max-w-5xl mx-auto">
    <div class="flex items-center justify-between border-b border-neutral-800 pb-4 mb-8">
      <div>
        <h1 class="text-xl font-medium tracking-wider uppercase">SOLENN</h1>
        <p class="text-xs text-neutral-400 mt-1">Click any product card to preview the multi-image detail window</p>
      </div>
      <div id="status" class="text-xs text-neutral-400">Connecting...</div>
    </div>

    <!-- Product Grid -->
    <div id="product-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-8"></div>
  </div>

  <!-- Product Detail Modal -->
  <div id="product-modal" onclick="closeModal()" class="hidden fixed inset-0 z-50 flex items-center justify-center bg-black/85 backdrop-blur-sm p-4">
    <div onclick="event.stopPropagation()" class="relative w-full max-w-4xl bg-neutral-950 border border-neutral-800 grid grid-cols-1 md:grid-cols-2 overflow-hidden shadow-2xl">
      
      <!-- Close Button -->
      <button onclick="closeModal()" class="absolute top-4 right-4 z-10 text-[11px] uppercase tracking-widest text-neutral-400 hover:text-white bg-neutral-900/90 border border-neutral-800 px-3 py-1.5 transition">
        Close [ESC]
      </button>

      <!-- Left: Main Preview + Angle Thumbnails -->
      <div class="bg-neutral-900 p-4 flex flex-col gap-3">
        <div class="aspect-square w-full overflow-hidden bg-neutral-950 border border-neutral-800">
          <img id="modal-main-img" src="" alt="" class="w-full h-full object-cover transition-opacity duration-200" />
        </div>
        <div id="modal-thumbnails" class="flex gap-2 overflow-x-auto pb-1"></div>
      </div>

      <!-- Right: Product Details -->
      <div class="p-6 md:p-8 flex flex-col justify-between">
        <div>
          <p class="text-[11px] uppercase tracking-widest text-neutral-500">SOLENN Headwear</p>
          <h2 id="modal-name" class="mt-2 text-2xl font-medium tracking-tight"></h2>
          <p id="modal-price" class="mt-2 text-lg text-neutral-300"></p>

          <div class="mt-6 border-t border-neutral-800 pt-4 space-y-2.5 text-sm text-neutral-400">
            <p><span class="text-neutral-200">Colorway:</span> <span id="modal-color"></span></p>
            <p><span class="text-neutral-200">Availability:</span> <span id="modal-stock"></span></p>
            <p><span class="text-neutral-200">Gallery Angles:</span> <span id="modal-count"></span></p>
          </div>
        </div>

        <button id="modal-cta" class="mt-8 w-full py-3.5 text-xs uppercase tracking-widest font-medium transition bg-white text-black hover:bg-neutral-200">
          Add to Bag
        </button>
      </div>
    </div>
  </div>

  <script>
    const SUPABASE_URL = 'https://indbpuvsnwjxoouqebsv.supabase.co';
    const SUPABASE_KEY = 'sb_publishable_F0phpmfxjM_WM5o43cpumg_XCLnxkny';
    const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let loadedProducts = [];

    async function loadPreview() {
      const statusEl = document.getElementById('status');
      const gridEl = document.getElementById('product-grid');

      const { data, error } = await client
        .from('products')
        .select('*')
        .eq('is_active', true)
        .order('id', { ascending: true });

      if (error) {
        statusEl.textContent = `Error: ${error.message}`;
        statusEl.classList.replace('text-neutral-400', 'text-red-400');
        return;
      }

      loadedProducts = data || [];
      statusEl.textContent = `Connected • ${loadedProducts.length} product(s)`;

      gridEl.innerHTML = loadedProducts.map((cap, index) => {
        const cover = (Array.isArray(cap.images) && cap.images.length > 0) ? cap.images[0] : cap.image_url;
        const photoCount = Array.isArray(cap.images) ? cap.images.length : 1;

        return `
          <div onclick="openModal(${index})" class="group cursor-pointer">
            <div class="relative aspect-square overflow-hidden bg-neutral-900 border border-neutral-800">
              <img src="${cover}" alt="${cap.name}" class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105" />
              <span class="absolute bottom-2.5 right-2.5 bg-black/75 backdrop-blur-sm text-[11px] px-2 py-0.5 text-neutral-300 border border-neutral-800">
                ${photoCount} photos
              </span>
            </div>
            <div class="mt-3 flex justify-between items-start">
              <div>
                <h3 class="text-sm font-medium group-hover:underline">${cap.name}</h3>
                <p class="text-xs text-neutral-500 mt-0.5">${cap.color || 'Signature'}</p>
              </div>
              <span class="text-sm text-neutral-200">₹${cap.price}</span>
            </div>
          </div>
        `;
      }).join('');
    }

    function openModal(index) {
      const cap = loadedProducts[index];
      if (!cap) return;

      const gallery = (Array.isArray(cap.images) && cap.images.length > 0)
        ? cap.images
        : [cap.image_url];

      document.getElementById('modal-name').textContent = cap.name;
      document.getElementById('modal-price').textContent = `₹${cap.price}`;
      document.getElementById('modal-color').textContent = cap.color || 'Signature';
      document.getElementById('modal-stock').textContent = cap.stock > 0 ? `In Stock (${cap.stock} units)` : 'Sold Out';
      document.getElementById('modal-count').textContent = `${gallery.length} views`;

      const ctaBtn = document.getElementById('modal-cta');
      if (cap.stock > 0) {
        ctaBtn.disabled = false;
        ctaBtn.textContent = 'Add to Bag';
        ctaBtn.className = 'mt-8 w-full py-3.5 text-xs uppercase tracking-widest font-medium transition bg-white text-black hover:bg-neutral-200';
      } else {
        ctaBtn.disabled = true;
        ctaBtn.textContent = 'Sold Out';
        ctaBtn.className = 'mt-8 w-full py-3.5 text-xs uppercase tracking-widest font-medium bg-neutral-800 text-neutral-500 cursor-not-allowed';
      }

      setActiveImage(gallery[0], gallery);
      document.getElementById('product-modal').classList.remove('hidden');
    }

    function setActiveImage(selectedUrl, gallery) {
      document.getElementById('modal-main-img').src = selectedUrl;

      const thumbsEl = document.getElementById('modal-thumbnails');
      thumbsEl.innerHTML = gallery.map((url, idx) => {
        const isSelected = url === selectedUrl;
        return `
          <button
            onclick='setActiveImage(${JSON.stringify(url)}, ${JSON.stringify(gallery)})'
            class="h-16 w-16 flex-shrink-0 overflow-hidden border transition ${isSelected ? 'border-white opacity-100' : 'border-neutral-800 opacity-50 hover:opacity-85'}"
          >
            <img src="${url}" alt="Angle ${idx + 1}" class="w-full h-full object-cover" />
          </button>
        `;
      }).join('');
    }

    function closeModal() {
      document.getElementById('product-modal').classList.add('hidden');
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') closeModal();
    });

    loadPreview();
  </script>
</body>
</html>
